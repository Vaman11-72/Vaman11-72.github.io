<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brisbane Games</title>
<meta name="description" content="Brisbane Games makes story games from India's epics, in English and Hindi.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root { --bg: #160a08; --fg: #f1e6d4; --muted: #b9a58f; --accent: #e7b45a; --rule: #3a2a20; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.6 "Source Sans 3", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 34rem; padding: 3rem max(20px, env(safe-area-inset-right)) 3rem max(20px, env(safe-area-inset-left)); text-align: center; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 3rem; margin: 0; color: var(--accent); }
  p { color: var(--muted); }
  .game { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
  .game h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.6rem; margin: 0; color: var(--fg); }
  a { color: var(--accent); }
  .email { user-select: all; color: var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Brisbane Games</h1>
  <p>Story games from India's epics, in English and Hindi.</p>
  <div class="game">
    <h2>Sunderkand: Journey of Hanuman</h2>
    <p>A hidden-object adventure through the Sundar Kand, fully voiced in English and Hindi.</p>
    <p><a href="sunderkand/privacy.html">Privacy policy</a></p>
  </div>
  <p>Contact: <span class="email">ekdantenterprise05@gmail.com</span></p>
</main>
</body>
</html>
